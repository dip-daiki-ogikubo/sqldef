# yaml-language-server: $schema=../../testutil/testcase.schema.json
# Tests for sequences declared with CREATE SEQUENCE, as opposed to the ones a serial or
# IDENTITY column creates behind the scenes. Every case states both up and down on
# purpose: omitting them makes a case idempotency-only, which does not compare the
# generated DDL at all.

SequenceCreated:
  current: ""
  desired: |
    CREATE SEQUENCE app_seq;
  up: |
    CREATE SEQUENCE app_seq;
  down: |
    DROP SEQUENCE "public"."app_seq";

SequenceWithOptionsCreated:
  current: ""
  desired: |
    CREATE SEQUENCE app_seq AS bigint START WITH 5 INCREMENT BY 2 MINVALUE 1 MAXVALUE 999 CACHE 3 NO CYCLE;
  up: |
    CREATE SEQUENCE app_seq AS bigint START WITH 5 INCREMENT BY 2 MINVALUE 1 MAXVALUE 999 CACHE 3 NO CYCLE;
  down: |
    DROP SEQUENCE "public"."app_seq";

SequenceIfNotExistsCreated:
  # IF NOT EXISTS is kept as written: it does not change the diff, since an existing
  # sequence is found by name either way, but it is part of the statement replayed when
  # the sequence is missing.
  current: ""
  desired: |
    CREATE SEQUENCE IF NOT EXISTS app_seq;
  up: |
    CREATE SEQUENCE IF NOT EXISTS app_seq;
  down: |
    DROP SEQUENCE "public"."app_seq";

SerialColumnSequenceIsNotDeclaredTwice:
  # A serial column creates a sequence of its own, which belongs to the column's
  # definition. Declaring it as a CREATE SEQUENCE as well would define the same object
  # twice, so an owned sequence is left out of the current schema.
  current: |
    CREATE TABLE t (
        id serial
    );
  desired: |
    CREATE TABLE t (
        id serial
    );
  up: ""
  down: ""

IdentityColumnSequenceIsNotDeclaredTwice:
  current: |
    CREATE TABLE t (
        id bigint NOT NULL GENERATED BY DEFAULT AS IDENTITY
    );
  desired: |
    CREATE TABLE t (
        id bigint NOT NULL GENERATED BY DEFAULT AS IDENTITY
    );
  up: ""
  down: ""

SequenceCommentCreated:
  current: |
    CREATE SEQUENCE app_seq;
  desired: |
    CREATE SEQUENCE app_seq;
    COMMENT ON SEQUENCE app_seq IS 'counts the things';
  up: |
    COMMENT ON SEQUENCE "public"."app_seq" IS 'counts the things';
  down: |
    COMMENT ON SEQUENCE "public"."app_seq" IS NULL;

SequenceCommentChanged:
  current: |
    CREATE SEQUENCE app_seq;
    COMMENT ON SEQUENCE app_seq IS 'before';
  desired: |
    CREATE SEQUENCE app_seq;
    COMMENT ON SEQUENCE app_seq IS 'after';
  up: |
    COMMENT ON SEQUENCE "public"."app_seq" IS 'after';
  down: |
    COMMENT ON SEQUENCE "public"."app_seq" IS 'before';

SequenceOptionChanged:
  current: |
    CREATE SEQUENCE app_seq MAXVALUE 9999;
  desired: |
    CREATE SEQUENCE app_seq MAXVALUE 100;
  up: |
    ALTER SEQUENCE "public"."app_seq" MAXVALUE 100;
  down: |
    ALTER SEQUENCE "public"."app_seq" MAXVALUE 9999;

SequenceOptionsChangedInOneStatement:
  # PostgreSQL takes every option in one ALTER SEQUENCE, so the changes are not split.
  current: |
    CREATE SEQUENCE app_seq AS bigint INCREMENT BY 1 MAXVALUE 9999 CACHE 1 NO CYCLE;
  desired: |
    CREATE SEQUENCE app_seq AS integer INCREMENT BY 5 MAXVALUE 100 CACHE 10 CYCLE;
  up: |
    ALTER SEQUENCE "public"."app_seq" AS integer INCREMENT BY 5 MAXVALUE 100 CACHE 10 CYCLE;
  down: |
    ALTER SEQUENCE "public"."app_seq" AS bigint INCREMENT BY 1 MAXVALUE 9999 CACHE 1 NO CYCLE;

SequenceOptionNotStatedIsLeftAlone:
  # A declaration that states no MAXVALUE is not read as asking for the default one:
  # resetting it would undo a decision the schema file never spoke about.
  current: |
    CREATE SEQUENCE app_seq MAXVALUE 500;
  desired: |
    CREATE SEQUENCE app_seq;
  up: ""
  down: ""

SequenceNoMinValueIsIdempotent:
  # The catalog always reports a MINVALUE, so NO MINVALUE has to be compared against the
  # value PostgreSQL gives a sequence declared without one -- 1 counting up, the type's
  # minimum counting down. Comparing it against "has a MINVALUE at all" emitted
  # ALTER SEQUENCE ... NO MINVALUE NO MAXVALUE on every run and never converged.
  current: |
    CREATE SEQUENCE app_seq NO MINVALUE NO MAXVALUE;
  desired: |
    CREATE SEQUENCE app_seq NO MINVALUE NO MAXVALUE;
  up: ""
  down: ""

SequenceNoMinValueCountingDownIsIdempotent:
  # Counting down the defaults are the other way round: MINVALUE is the type's minimum and
  # MAXVALUE is -1.
  current: |
    CREATE SEQUENCE app_seq INCREMENT BY -2 NO MINVALUE NO MAXVALUE;
  desired: |
    CREATE SEQUENCE app_seq INCREMENT BY -2 NO MINVALUE NO MAXVALUE;
  up: ""
  down: ""

SequenceNoMinValueOnSmallintIsIdempotent:
  current: |
    CREATE SEQUENCE app_seq AS smallint NO MINVALUE NO MAXVALUE;
  desired: |
    CREATE SEQUENCE app_seq AS smallint NO MINVALUE NO MAXVALUE;
  up: ""
  down: ""

SequenceOptionsBackToDefault:
  current: |
    CREATE SEQUENCE app_seq MINVALUE 5 MAXVALUE 500;
  desired: |
    CREATE SEQUENCE app_seq NO MINVALUE NO MAXVALUE;
  up: |
    ALTER SEQUENCE "public"."app_seq" NO MINVALUE NO MAXVALUE;
  down: |
    ALTER SEQUENCE "public"."app_seq" MINVALUE 5 MAXVALUE 500;
